name: 自动同步 tvbox 配置

on:
  schedule:
    # 每天北京时间早上 8 点自动执行一次 (UTC 时间 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 抓取 qist/tvbox 并拉取最新代码
        run: |
          # 配置本地 Git 用户信息
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 添加 qist/tvbox 为远程上游仓库
          git remote add upstream https://github.com
          
          # 获取上游仓库的所有分支和更新
          git fetch upstream
          
          # 强制将上游 master 分支的最新内容覆盖到你当前仓库的 master 分支
          # 如果你的默认分支叫 main，请将下方的 master 改为 main
          git checkout master
          git reset --hard upstream/master

      - name: 推送更新到你的仓库
        run: |
          # 强制推送到你自己的仓库，确保完全保持同步
          git push origin master --force
